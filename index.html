<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Links</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>

  <main class="card">
    <div class="avatar">✨</div>
    <h1>Your Name</h1>
    <p class="bio">Creator • Developer • Dreamer</p>

    <div class="links">
      <a class="link-btn" href="https://t.me/" target="_blank" rel="noopener">
        <span>📱 Telegram</span><span>↗</span>
      </a>
      <a class="link-btn" href="https://instagram.com/" target="_blank" rel="noopener">
        <span>📸 Instagram</span><span>↗</span>
      </a>
      <a class="link-btn" href="https://youtube.com/" target="_blank" rel="noopener">
        <span>▶️ YouTube</span><span>↗</span>
      </a>
      <a class="link-btn" href="#" data-copy="https://example.com">
        <span>🌐 My Website</span><span>📋</span>
      </a>
      <a class="link-btn" href="#" data-copy="https://github.com/">
        <span>💻 GitHub</span><span>📋</span>
      </a>
    </div>

    <p id="message" class="message"></p>
    <p class="footer">Made with ❤️ • <span id="year"></span></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
